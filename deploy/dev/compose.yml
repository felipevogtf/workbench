services:
  server:
    build:
      context: ../../workbench-server
      dockerfile: ../deploy/dev/Dockerfile
    volumes:
      - ../../workbench-server:/app
      - server_node_modules:/app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - ../../workbench-server/.env
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  app:
    build:
      context: ../../workbench-app
      dockerfile: ../deploy/dev/Dockerfile.app
    volumes:
      - ../../workbench-app:/app
      - app_node_modules:/app/node_modules
    ports:
      - '4200:4200'
    environment:
      # El proxy de `ng serve` reenvía /api al servicio del backend.
      API_PROXY_TARGET: 'http://server:3000'
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    depends_on:
      - server

volumes:
  server_node_modules:
  app_node_modules:
