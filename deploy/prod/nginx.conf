server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker DNS: resuelve `server` en cada petición, así nginx arranca aunque el backend aún no exista.
  resolver 127.0.0.11 valid=10s;

  # /api/* -> backend (que no usa prefijo). Mismo origen, así que no necesita CORS.
  location /api/ {
    set $upstream http://server:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: caché larga.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de la SPA (/pull-requests/..., /agents/...): siempre index.html, sin caché.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
