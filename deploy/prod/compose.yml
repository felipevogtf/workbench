# Producción: servidor + front (nginx). La base de datos NO está aquí: se usa el Postgres que ya
# corre en el host (compose ~/git_repos/docker-compose.db.yml, red `git_repos_default`).
#
#   cp server.env.example server.env      # y completar las credenciales
#   docker compose up -d --build
name: workbench

services:
  server:
    build:
      context: ../../workbench-server
      dockerfile: ../deploy/prod/server.Dockerfile
    restart: unless-stopped
    env_file:
      - ./server.env
    volumes:
      - reviews:/data/reviews
      # Los repos: un clon por repositorio y los worktrees de las tareas y las PRs. Sobreviven a los despliegues.
      - repos:/data/repos
      # Archivos adjuntos del chat: una conversación puede seguir días después de subirlos.
      - chat_attachments:/data/chat-attachments
      # Sesión de los CLIs que se inician con login (agy, copilot): sobrevive a los reinicios.
      - cli_home:/home/node/.gemini
      - copilot_home:/home/node/.copilot
    networks:
      - default
      - db
    # Sin puertos publicados: solo el nginx de `app` lo alcanza (por /api).

  app:
    build:
      context: ../..
      dockerfile: deploy/prod/app.Dockerfile
    restart: unless-stopped
    ports:
      # WORKBENCH_BIND (en deploy/prod/.env) ata el puerto a una IP, p. ej. la de Tailscale del host;
      # sin definir, escucha en todas las interfaces.
      - '${WORKBENCH_BIND:-0.0.0.0}:4321:80'
    depends_on:
      - server

networks:
  # Red del Postgres existente.
  db:
    external: true
    name: git_repos_default

volumes:
  reviews:
  repos:
  chat_attachments:
  cli_home:
  copilot_home:
