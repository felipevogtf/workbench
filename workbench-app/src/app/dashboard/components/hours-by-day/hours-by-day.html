<ul class="bars">
  @for (bucket of buckets(); track bucket.key) {
    <li class="bar-row" [class.bar-row--empty]="bucket.hours === 0">
      <span class="bar-row__label">{{ bucket.label }}</span>
      <span class="bar-row__track" aria-hidden="true">
        <span class="bar-row__bar" [style.width.%]="width(bucket.hours)"></span>
      </span>
      <span class="bar-row__hours">{{ hoursLabel(bucket.hours) }}</span>
    </li>
  }
</ul>
