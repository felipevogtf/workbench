<div class="sidebar__header">
  <a class="brand" routerLink="/" aria-label="Workbench, ir al inicio" (click)="closed.emit()">
    <app-icon name="logo" size="1.4rem" />
    <span>Workbench</span>
  </a>
  <button
    class="sidebar__close"
    app-icon-button
    type="button"
    label="Cerrar menú"
    (click)="closed.emit()"
  >
    <app-icon name="x" />
  </button>
</div>

<nav aria-label="Módulos">
  <ul>
    @for (item of items(); track item.label) {
      <li>
        @if (item.children; as children) {
          <button
            type="button"
            class="nav-link nav-group"
            [class.has-active]="hasActiveChild(item)"
            [attr.aria-expanded]="isOpen(item)"
            [attr.aria-controls]="groupId(item)"
            (click)="toggle(item)"
          >
            <app-icon [name]="item.icon" />
            <span class="nav-link__label">{{ item.label }}</span>
            <app-icon class="nav-group__chevron" name="chevron-down" size="1.1rem" />
          </button>
          @if (isOpen(item)) {
            <ul class="nav-sub" [id]="groupId(item)">
              @for (child of children; track child.path) {
                <li>
                  <a
                    class="nav-link nav-link--child"
                    [routerLink]="child.path"
                    routerLinkActive="is-active"
                    ariaCurrentWhenActive="page"
                    (click)="closed.emit()"
                  >
                    <app-icon [name]="child.icon" size="1.1rem" />
                    <span class="nav-link__label">{{ child.label }}</span>
                  </a>
                </li>
              }
            </ul>
          }
        } @else {
          <a
            class="nav-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            ariaCurrentWhenActive="page"
            (click)="closed.emit()"
          >
            <app-icon [name]="item.icon" />
            <span class="nav-link__label">{{ item.label }}</span>
          </a>
        }
      </li>
    }
  </ul>
</nav>
