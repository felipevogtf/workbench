<a class="skip-link" href="#main">Saltar al contenido</a>

<header class="topbar">
  <button app-icon-button type="button" label="Abrir menú" (click)="openDrawer()">
    <app-icon name="menu" />
  </button>
  <app-icon name="logo" size="1.5rem" />
  <div class="topbar__title">
    <span class="topbar__brand">Workbench</span>
    @if (topbar.subtitle(); as subtitle) {
      <h1 class="topbar__subtitle" [title]="subtitle">{{ subtitle }}</h1>
    }
  </div>
  <div class="topbar__actions">
    <ng-container [ngTemplateOutlet]="topbar.actions()" />
  </div>
</header>

<button
  type="button"
  class="overlay"
  tabindex="-1"
  aria-label="Cerrar menú"
  [class.is-active]="drawerOpen()"
  (click)="closeDrawer()"
></button>
<app-sidebar [open]="drawerOpen()" [drawer]="immersive()" (closed)="closeDrawer()" />

<main id="main" tabindex="-1">
  <router-outlet />
</main>
