@let plan = readyPlan();

<app-chat-panel
  [store]="chat"
  heading="Mejora el plan con la IA"
  [context]="issue().name"
  [info]="
    plan
      ? 'Con el plan de ' + (plan.createdAt | timeAgo)
      : 'Todavía sin plan: al replanificar se hará desde cero'
  "
  emptyTitle="¿Cómo mejoramos el plan?"
  placeholder="Pregunta, aclara o corrige algo del plan…"
  [suggestions]="suggestions"
>
  <p chat-empty>
    La IA conoce la tarea, sus tickets, el plan y el código de sus repos. Aclara dudas, pásale otros
    tickets (por ejemplo <code>MEL-123</code>) o corrige lo que haga falta, y pulsa «Replanificar»
    para actualizar el plan.
  </p>

  <div chat-actions>
    <button
      app-button
      variant="secondary"
      size="sm"
      type="button"
      [disabled]="!canReplan()"
      [loading]="plans.requesting()"
      (click)="replan()"
    >
      <app-icon name="sparkles" size="1em" /> Replanificar con esta conversación
    </button>
  </div>
</app-chat-panel>
