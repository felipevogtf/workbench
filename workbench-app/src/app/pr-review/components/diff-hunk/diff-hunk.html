<div class="hunk__head">
  <code class="hunk__header">{{ hunk().header }}</code>
  <div class="hunk__actions"><ng-content select="[hunk-actions]" /></div>
</div>

<div class="rows" [attr.data-mode]="mode()">
  @for (row of rows(); track $index) {
    <div class="row">
      @if (mode() !== 'new') {
        <span class="num" [attr.data-kind]="row.left?.kind ?? 'empty'">{{ row.left?.line }}</span>
        <span class="code" [attr.data-kind]="row.left?.kind ?? 'empty'">{{ row.left?.text }}</span>
      }
      @if (mode() !== 'old') {
        <span
          class="num"
          [class.num--right]="mode() === 'split'"
          [attr.data-kind]="row.right?.kind ?? 'empty'"
          >{{ row.right?.line }}</span
        >
        <span class="code" [attr.data-kind]="row.right?.kind ?? 'empty'">{{
          row.right?.text
        }}</span>
      }
    </div>
  }
</div>
