<app-chat-panel
  [store]="store"
  [heading]="'Pregúntale a ' + (assistant()?.name ?? 'la IA')"
  [assistant]="assistant()"
  [context]="context()"
  [info]="info()"
  [infoTitle]="store.context()?.path ?? ''"
  emptyTitle="¿Qué quieres saber de esta PR?"
  [suggestions]="suggestions"
>
  <p chat-empty>
    La IA tiene el código de la rama a mergear. También puedes usar el botón
    <app-icon name="sparkles" size="1em" /> de cada segmento del diff para que te explique qué hace.
  </p>
</app-chat-panel>
