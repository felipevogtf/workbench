<app-dialog heading="Nueva sesión" [(open)]="open">
  <form id="session-form" class="stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field
      label="Título"
      for="session-title"
      required
      [error]="invalid('title') ? 'Escribe un título' : null"
    >
      <app-text-input
        inputId="session-title"
        formControlName="title"
        placeholder="Ej.: Anulación de guías"
        [invalid]="invalid('title')"
      />
    </app-form-field>

    <app-form-field
      label="Proyectos"
      for="session-projects"
      hint="Los repositorios donde vas a trabajar. No necesitas un ticket de Plane."
      [error]="projectsError()"
    >
      <app-chip-picker
        label="Proyectos"
        emptyText="Todavía no hay proyectos. Créalos en Proyectos."
        [options]="repoOptions()"
        [(selected)]="selectedRepos"
      />
    </app-form-field>

    <app-form-field
      label="Proyecto de tareas"
      for="session-project"
      hint="Solo si vas a reunir tickets de Plane: el proyecto de tareas donde vive el grupo. Si eliges proyectos arriba, puedes dejarlo vacío."
    >
      <app-select
        inputId="session-project"
        formControlName="projectId"
        placeholder="Ninguno (sesión libre)"
        [options]="projectOptions()"
      />
    </app-form-field>
    <p class="hint">
      En la sesión conversas con la IA, pides el plan cuando quieras y puedes sumar tickets de Plane o crear tickets locales.
    </p>
  </form>

  <ng-container dialog-footer>
    <button app-button variant="secondary" type="button" (click)="open.set(false)">Cancelar</button>
    <button app-button type="submit" form="session-form" [loading]="store.saving()">
      Crear sesión
    </button>
  </ng-container>
</app-dialog>
