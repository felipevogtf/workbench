<div class="generator" [formGroup]="form">
  <div class="result">
    <output class="result__password" aria-live="polite" aria-label="Contraseña generada">{{
      password()
    }}</output>
    <button app-icon-button type="button" label="Generar otra contraseña" (click)="regenerate()">
      <app-icon name="refresh" />
    </button>
    <button app-button type="button" (click)="copy()">
      <app-icon name="copy" size="1em" /> Copiar
    </button>
  </div>

  <div class="strength" [attr.data-level]="strength().level">
    <div
      class="strength__bar"
      role="meter"
      aria-label="Fortaleza de la contraseña"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="bits()"
      [attr.aria-valuetext]="strengthLabel()"
    >
      <span class="strength__fill" [style.width.%]="strength().ratio * 100"></span>
    </div>
    <span class="strength__label">{{ strengthLabel() }}</span>
  </div>

  <div class="options">
    <div class="option">
      <label class="option__label" for="generator-length">Longitud</label>
      <div class="length">
        <output class="length__value" for="generator-length">{{
          form.controls.length.value
        }}</output>
        <input
          id="generator-length"
          type="range"
          formControlName="length"
          [min]="minLength"
          [max]="maxLength"
          step="1"
        />
      </div>
    </div>

    <div class="option">
      <span class="option__label" id="generator-sets">Caracteres</span>
      <div class="sets" role="group" aria-labelledby="generator-sets">
        <app-checkbox formControlName="uppercase">Mayúsculas</app-checkbox>
        <app-checkbox formControlName="lowercase">Minúsculas</app-checkbox>
        <app-checkbox formControlName="digits">Números</app-checkbox>
        <app-checkbox formControlName="symbols">Símbolos</app-checkbox>
      </div>
    </div>

    <div class="option">
      <span class="option__label" id="generator-readability">Legibilidad</span>
      <div class="sets" role="group" aria-labelledby="generator-readability">
        <app-checkbox formControlName="avoidAmbiguous">
          Evitar ambiguos (I, l, 1, O, 0)
        </app-checkbox>
      </div>
    </div>
  </div>
</div>
