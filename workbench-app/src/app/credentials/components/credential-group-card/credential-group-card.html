<app-card>
  <div card-header class="head">
    <app-icon name="lock" />
    <h4 class="head__name break-anywhere">{{ group().name }}</h4>
    @if (group().category) {
      <app-tag>{{ group().category }}</app-tag>
    }
    <app-menu
      class="head__menu"
      [label]="'Acciones de ' + group().name"
      [items]="groupMenu"
      (selected)="onGroupMenu($event)"
    />
  </div>

  @if (group().items.length === 0) {
    <p class="empty">Este grupo todavía no tiene campos.</p>
  } @else {
    <ul class="items">
      @for (item of group().items; track item.id) {
        <li>
          <span class="item__key break-anywhere">{{ item.key }}</span>
          <span
            class="item__value"
            [class.item__value--masked]="isMasked(item)"
            [attr.aria-hidden]="isMasked(item) ? 'true' : null"
            >{{ shown(item) }}</span
          >
          <div class="item__actions">
            @if (item.sensitive) {
              <button
                app-icon-button
                type="button"
                [label]="(isRevealed(item) ? 'Ocultar ' : 'Mostrar ') + item.key"
                (click)="toggleReveal(item)"
              >
                <app-icon [name]="isRevealed(item) ? 'eye-off' : 'eye'" />
              </button>
            }
            <button
              app-icon-button
              type="button"
              [label]="'Copiar ' + item.key"
              (click)="copy(item)"
            >
              <app-icon name="copy" />
            </button>
            <app-menu
              [label]="'Acciones de ' + item.key"
              [items]="itemMenu"
              (selected)="onItemMenu(item, $event)"
            />
          </div>
        </li>
      }
    </ul>
  }

  <button
    card-footer
    app-button
    variant="secondary"
    size="sm"
    type="button"
    (click)="addItem.emit()"
  >
    <app-icon name="plus" size="1em" /> Agregar campo
  </button>
</app-card>
